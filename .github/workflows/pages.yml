name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24.19.0
          install: false
          cache: true
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_REPOSITORY_URL: https://github.com/${{ github.repository }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_DOMAINS: ${{ vars.UMAMI_DOMAINS }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
